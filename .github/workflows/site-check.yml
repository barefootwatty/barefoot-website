name: Site check
# Runs on GitHub's servers every Monday and whenever this file changes.
# If it fails, GitHub emails the repo owner. Silent when everything is fine.
on:
  schedule:
    - cron: "0 22 * * 0"   # Monday 7:30am Darwin
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/site-check.yml"
      - "pipeline/tools/site_check.py"
      - "pipeline/legacy-paths.txt"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/tools/site_check.py
